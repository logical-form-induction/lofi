[package]
name = "lofi-native"
description = "The Python bindings of LoFI's chart kernel, built as lofi._native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
# the module is tested through Python; a cdylib has no Rust doctests
doctest = false

[dependencies]
lofi-chart.workspace = true
lofi-grammar.workspace = true
num-bigint.workspace = true
pyo3 = { workspace = true, features = ["macros", "abi3-py314"] }

[lints]
workspace = true
