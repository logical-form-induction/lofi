# The model, objective, trainer and evaluator every tiny point shares.
# A point document selects a grammar and the represented space that maps its rules.
defaults:
  - data.datasets.train.dataset: sentences
  - data.datasets.train.dataset.language: propositional
  - data.datasets.train.featurizer: unlabeled
parse: {retain: forest, reachability: all}
approximation: {residual_mass: 0.9}
model:
  language: {from: data}
  parser:
    kind: inside-outside
    width: 4
  token_encoder:
    kind: learned
    width: 4
  subword_pooler:
    kind: first
  encoders:
    terms:
      kind: tree-rnn
      width: 4
      layers: 1
      norm_cap: null
  controller:
    kind: mlp
    hidden: [{width: 4, activation: tanh}]
  decoders:
    identity:
      kind: tree-rnn
      width: 4
    application:
      kind: tree-rnn
      width: 4
  spaces:
    categories:
      sort: Cat
      encoder: terms
      identity: identity
  readouts:
    types:
      kind: terms
      space: categories
      reads: inside
      targets: grammar-goal
      output: sentences
      mass: factorized
    category-terms:
      kind: terms
      space: categories
      reads: inside
      decoding: {strategy: exhaustive, cap: 512}
loss:
  terms:
    - objective:
        kind: grammaticality
        readout: sentences
    - objective:
        kind: coherence
        readout: category-terms
        space: categories
        estimator: truncated
        warmup: null
      weight: 0.1
trainer:
  kind: parser
  dataset: train
  epochs: 1
  batch_size: 2
  batch_sampler: {kind: length-bucket, bucket_factor: 100, reshuffle_each_epoch: false}
  max_grad_norm: null
  active_groups: [token_encoder, terms, identity, application, controller, parser]
  early_stopping:
    metric: loss/grammaticality
    mode: min
    patience: 2
    minimum_delta: 0.0
    keep_best: 1
  checkpoints: {interval: 1, keep: 1}
release: {checkpoint: validation-best}
optimizer:
  kind: adamw
  weight_decay: 0.0
device_policy:
  device: cpu
  compute_dtype: float32
  deterministic: true
  matmul_precision: highest
  activation_memory_bytes: 8000000000
evaluators:
  held-out:
    kind: bracketing
    interval: {replicates: 20, level: 0.95}
    punctuation: {source: none, forms: []}
    decoder: minimum-risk
    conventions:
      punctuation: keep
      unary_chains: keep
      trivial_spans: keep
      minimum_length: 1
      aggregation: corpus
      coverage: zero
      self_arcs: allow
      gold_derivation: canonical
