# A grounding trained on a collected SNLI-format release over the slash grammar.
# The release carries no logical forms, so the learner declares its own
# language, grammar and interpretation.
defaults:
  - data.datasets.train.dataset: snli
  - data.datasets.train.dataset.language: propositional
  - data.datasets.train.dataset.grammar: slash
  - data.datasets.train.featurizer: pair
  - model.grounding: nli-baseline
  - model.spaces.categories.combinators: slash
parse: {retain: forest, reachability: all}
approximation: {residual_mass: 0.9}
data:
  datasets:
    train:
      dataset:
        training_split: train
        sources:
          - source: tests/acceptance/documents/corpora/nli/train.jsonl
            release: &release
              source_id: slash-nli
              release_id: "1"
              split: train
              language: en
              source_method: manual
              spdx: CC0-1.0
          - source: tests/acceptance/documents/corpora/nli/validation.jsonl
            release:
              <<: *release
              split: validation
        language:
          bounds:
            Ty: {layout: complete-tree, depth: 4, nodes: null, order: df, free_ranks: 0}
            Tm: {layout: complete-tree, depth: 5, nodes: null, order: df, free_ranks: 0}
            Cat: {layout: complete-tree, depth: 4, nodes: null, order: df, free_ranks: 0}
model:
  language:
    from: inline
    language: ${data.datasets.train.dataset.language}
    grammar: ${data.datasets.train.dataset.grammar}
    interpretation:
      entity: e
      truth: t
      countermodels:
        method: exhaustive
        carriers: {e: 1, v: 1}
        structures: 16
        seed: 0
        full_function_space_cap: 64
      erasure:
        kind: signature-morphism
        atoms: {S: t, NP: e}
      constants:
        - {name: john, type: e, classes: [individual]}
        - {name: mary, type: e, classes: [individual]}
        - {name: sleep, type: "e -> t", classes: [predicate]}
        - {name: see, type: "e -> e -> t", classes: [predicate]}
      meanings: {source: {kind: lexical}}
  parser: {kind: inside-outside, width: 4}
  token_encoder: {kind: learned, width: 4}
  subword_pooler: {kind: first}
  controller: {kind: mlp, hidden: [{width: 4, activation: tanh}]}
  encoders:
    terms: {kind: tree-rnn, width: 4, layers: 1, norm_cap: null}
    logical-forms: {kind: tree-rnn, width: 4, layers: 1, norm_cap: null}
  decoders:
    identity: {kind: tree-rnn, width: 4}
    application: {kind: tree-rnn, width: 4}
    form-identity:
      kind: tree-rnn
      width: 4
      type_directed: {prefix: type-grammar, mask: known}
  spaces:
    categories: {sort: Cat, encoder: terms, identity: identity}
    semantics: {sort: Tm, encoder: logical-forms, identity: form-identity}
  readouts:
    forms:
      kind: terms
      space: semantics
      reads: inside
      decoding: {strategy: exhaustive, cap: 16}
loss:
  terms:
    - objective:
        kind: inference
        signal: likelihood
        response: {kind: label}
        auxiliary_weight: 0.0
trainer:
  kind: parser
  dataset: train
  epochs: 1
  batch_size: 2
  batch_sampler: {kind: length-bucket, bucket_factor: 100, reshuffle_each_epoch: false}
  max_grad_norm: null
  active_groups:
    - token_encoder
    - terms
    - logical-forms
    - identity
    - application
    - form-identity
    - controller
    - parser
  early_stopping:
    metric: loss/inference
    mode: min
    patience: 2
    minimum_delta: 0.0
    keep_best: 1
  checkpoints: {interval: 1, keep: 1}
release: {checkpoint: validation-best}
optimizer: {kind: adamw, weight_decay: 0.0}
device_policy:
  device: cpu
  compute_dtype: float32
  deterministic: true
  matmul_precision: highest
  activation_memory_bytes: 8000000000
