# Higher-order-pattern soft proof search with exact THF rechecking.
defaults:
  - second-order-proof-base
  - model.grounding: neural-proof
model:
  language: {from: data}
  grounding:
    scorer:
      order: second
trainer:
  active_groups:
    - token_encoder
    - terms
    - logical-forms
    - identity
    - application
    - form-identity
    - controller
    - parser
    - scorer
