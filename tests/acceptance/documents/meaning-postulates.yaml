# A language with a closed meaning postulate over its interpretation constants.
defaults:
  - slash-point
  - data.datasets.train.dataset.language: propositional
  - data.datasets.train.dataset.interpretation: first-order
data:
  datasets:
    train:
      dataset:
        language:
          logic:
            equality: false
            negation: not
            prover: {kind: tptp, engine: vampire, dialect: tff}
            labeling: {budget: {}}
            postulates:
              - 'sleep(john) => sleep(mary)'
