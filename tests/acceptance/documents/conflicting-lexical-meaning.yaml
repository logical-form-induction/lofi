# A lexical meaning whose inferred function type conflicts with its NP entry.
defaults:
  - arrow-point
data:
  datasets:
    train:
      dataset:
        language:
          logic:
            equality: false
            negation: not
            prover: {kind: truth-table, timeout: 5.0}
            labeling: {budget: {}}
        grammar:
          lexicon:
            kind: inline
            entries:
              - {form: john, category: NP, meaning: '\x. sleep(x)'}
              - {form: mary, category: NP, meaning: mary}
              - {form: sleeps, category: "S->NP", meaning: '\x. sleep(x)'}
              - {form: sees, category: "(S->NP)->NP", meaning: '\y. \x. see(x)(y)'}
        interpretation:
          erasure:
            kind: signature-morphism
            atoms: {S: t, NP: e}
          constants:
            - {name: john, type: e, classes: [individual]}
            - {name: mary, type: e, classes: [individual]}
            - {name: sleep, type: "e -> t", classes: [predicate]}
            - {name: see, type: "e -> e -> t", classes: [predicate]}
          meanings: {source: {kind: lexical}}
          actions:
            "application:arrow": '\a. \f. f(a)'
