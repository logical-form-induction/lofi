# A decompositional verb and an atomic verb under the same declared modifier.
defaults:
  - arrow-point
data:
  datasets:
    train:
      dataset:
        grammar:
          lexicon:
            kind: inline
            entries:
              - {form: john, category: NP, meaning: john}
              - {form: breaks, category: "S->NP", meaning: '\x. become(broken(x))'}
              - {form: taps, category: "S->NP", meaning: '\x. tap(x)'}
        interpretation:
          erasure:
            kind: signature-morphism
            atoms: {S: t, NP: e}
          constants:
            - {name: john, type: e, classes: [individual]}
            - {name: broken, type: "e -> t", classes: [predicate, result-state]}
            - {name: tap, type: "e -> t", classes: [predicate]}
            - {name: become, type: "t -> t", classes: [change-state]}
            - {name: again, type: "t -> t", classes: [repetition]}
          meanings: {source: {kind: lexical}}
          actions:
            "application:arrow": '\a. \f. f(a)'
