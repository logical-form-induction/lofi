# The slash pair with application and one declared set of ground coercions.
name: coercion
signature:
  primitives: [S, NP, N]
  constructors:
    - {name: "/", kind: [Cat, Cat, Cat], notation: {style: infix, spelling: /, precedence: 10, associativity: left}}
    - {name: '\', kind: [Cat, Cat, Cat], notation: {style: infix, spelling: '\', precedence: 10, associativity: left}}
  functors:
    - {name: "/", constructor: "/", argument_side: right, opposite: '\'}
    - {name: '\', constructor: '\', argument_side: left, opposite: "/"}
rules:
  name: coercion
  rules:
    - {rule: application, view: /}
    - {rule: application, view: "\\"}
    - rule: coercions
      label: bare-plural
      entries: ["N => NP"]
lexicon:
  kind: inline
  entries:
    - {form: john, category: NP, meaning: john}
    - {form: dogs, category: N, meaning: '\x. dog(x)'}
    - {form: sleeps, category: "S\\NP", meaning: '\x. sleep(x)'}
    - {form: sees, category: "S\\NP/NP", meaning: '\y. \x. see(x)(y)'}
goal:
  kind: root
  categories: [S]
budget:
  unary_rounds: 1
formalism: declared
