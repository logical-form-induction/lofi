# An arrow and a sum constructor with left and right injections into any sum.
name: arrow-injection
signature:
  primitives: [S, NP]
  constructors:
    - {name: "arrow", kind: [Cat, Cat, Cat], notation: {style: infix, spelling: ->, precedence: 10, associativity: left}}
    - {name: "+", kind: [Cat, Cat, Cat], notation: {style: infix, spelling: +, precedence: 10, associativity: left}}
  functors:
    - {name: "arrow", constructor: "arrow", argument_side: either, opposite: "arrow"}
rules:
  name: arrow-injection
  rules:
    - rule: pattern
      name: apply
      premises:
        - pattern: node
          operator: {kind: fixed, name: arrow}
          arguments:
            - &result {pattern: term, name: X}
            - &argument {pattern: term, name: Y}
        - *argument
      conclusion: *result
    - rule: pattern
      name: inject-left
      targets: [NP, S]
      premises: [{pattern: term, name: A}]
      conclusion:
        pattern: node
        operator: {kind: fixed, name: "+"}
        arguments: [{pattern: term, name: A}, {pattern: term, name: B}]
    - rule: pattern
      name: inject-right
      targets: [NP, S]
      premises: [{pattern: term, name: B}]
      conclusion:
        pattern: node
        operator: {kind: fixed, name: "+"}
        arguments: [{pattern: term, name: A}, {pattern: term, name: B}]
lexicon:
  kind: inline
  entries:
    - {form: john, category: NP}
    - {form: mary, category: NP}
    - {form: sleeps, category: "S->(NP+S)"}
    - {form: snores, category: "S->NP"}
goal:
  kind: root
  categories: [S]
budget:
  unary_rounds: 1
formalism: declared
