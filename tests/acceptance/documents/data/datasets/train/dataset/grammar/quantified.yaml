# The slash pair with a type-raised quantified subject and a predicate modifier.
name: quantified
signature:
  primitives: [S, NP]
  constructors:
    - {name: "/", kind: [Cat, Cat, Cat], notation: {style: infix, spelling: /, precedence: 10, associativity: left}}
    - {name: '\', kind: [Cat, Cat, Cat], notation: {style: infix, spelling: '\', precedence: 10, associativity: left}}
  functors:
    - {name: "/", constructor: "/", argument_side: right, opposite: '\'}
    - {name: '\', constructor: '\', argument_side: left, opposite: "/"}
rules:
  name: application
  rules:
    - {rule: application, view: /}
    - {rule: application, view: "\\"}
lexicon:
  kind: inline
  entries:
    - {form: john, category: NP, meaning: john}
    - {form: mary, category: NP, meaning: mary}
    - {form: everyone, category: "S/(S\\NP)", meaning: '\P. every x.(person(x), P(x))'}
    - {form: sleeps, category: "S\\NP", meaning: '\x. sleep(x) && snore(x)'}
    - {form: sees, category: "S\\NP/NP", meaning: '\y. \x. every z.(see(x)(z), see(z)(y) && sleep(z))'}
    - {form: quietly, category: "(S\\NP)\\(S\\NP)", meaning: '\p. \x. quiet(p)(x)'}
goal:
  kind: root
  categories: [S]
budget:
  unary_rounds: 1
formalism: declared
