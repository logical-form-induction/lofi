# Two directed slash pairs, the second restricted to composition, as in multimodal CCG.
name: multimodal
signature:
  primitives: [S, NP]
  constructors:
    - {name: "/", kind: [Cat, Cat, Cat], notation: {style: infix, spelling: /, precedence: 10, associativity: left}}
    - {name: '\', kind: [Cat, Cat, Cat], notation: {style: infix, spelling: '\', precedence: 10, associativity: left}}
    - {name: "/x", kind: [Cat, Cat, Cat], notation: {style: infix, spelling: /x, precedence: 10, associativity: left}}
    - {name: "\\x", kind: [Cat, Cat, Cat], notation: {style: infix, spelling: \\x, precedence: 10, associativity: left}}
  functors:
    - {name: "/", constructor: "/", argument_side: right, opposite: '\'}
    - {name: '\', constructor: '\', argument_side: left, opposite: "/"}
    - {name: "/x", constructor: "/x", argument_side: right, opposite: "\\x"}
    - {name: "\\x", constructor: "\\x", argument_side: left, opposite: "/x"}
rules:
  name: multimodal
  rules:
    - {rule: application, view: /}
    - {rule: application, view: "\\"}
    - {rule: application, view: "/x"}
    - {rule: composition, direction: unrestricted, order: 1, view: "/x"}
lexicon:
  kind: inline
  entries:
    - {form: john, category: NP}
    - {form: mary, category: NP}
    - {form: sleeps, category: "S\\NP"}
    - {form: sees, category: "(S\\NP)/xNP"}
goal:
  kind: root
  categories: [S]
budget:
  unary_rounds: 1
formalism: declared
