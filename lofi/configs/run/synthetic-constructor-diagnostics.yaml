defaults:
  - synthetic-parser
evaluators:
  constructor-none: &constructor
    kind: constructor-diagnostics
    interval: {replicates: 50, level: 0.95}
    readout: category-terms
    view:
      representative: NP
      roles: {"/": [result, argument], "\\": [result, argument]}
    normalization: none
    widths: [1, 2, 4]
    depths: [1, 2, 3]
    collapse_margin: 0.5
    conventions: {punctuation: keep, unary_chains: keep, trivial_spans: keep, minimum_length: 0, aggregation: sentence, coverage: zero, self_arcs: allow, gold_derivation: canonical}
  constructor-depth:
    <<: *constructor
    normalization: depth
  constructor-nodes:
    <<: *constructor
    normalization: nodes
  constructor-terminals:
    <<: *constructor
    normalization: terminals
