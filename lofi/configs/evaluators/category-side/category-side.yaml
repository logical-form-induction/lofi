kind: category-side
interval: {replicates: 1000, level: 0.95}
readout: category-terms
supertag_beta: 0.1
astar: {proposer: {kind: supertag-beam}}
decode: {kind: viterbi}
dependency_interpretation: dependency
dependency_mode: labeled-directed
alignment:
  kind: one-to-one
  tie_break: least-gold-label
  fit_on: dev
  score_on: test
  random_floor: {replicates: 1000, level: 0.95}
  stability: {replicates: 1000, level: 0.95}
conventions:
  punctuation: keep
  unary_chains: keep
  trivial_spans: keep
  minimum_length: 0
  aggregation: corpus
  coverage: zero
  self_arcs: forbid
  gold_derivation: canonical
