kind: expert-categories
interval: {replicates: 1000, level: 0.95}
readout: category-terms
taxonomy: [wrong-argument-direction, wrong-arity, wrong-result]
alignment:
  kind: many-to-one
  tie_break: largest-gold-marginal
  fit_on: dev
  score_on: test
  random_floor: {replicates: 1000, level: 0.95}
  stability: {replicates: 1000, level: 0.95}
conventions: {punctuation: keep, unary_chains: keep, trivial_spans: keep, minimum_length: 0, aggregation: corpus, coverage: zero, self_arcs: allow, gold_derivation: canonical}
