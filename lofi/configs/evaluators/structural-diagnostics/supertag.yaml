kind: structural-diagnostics
interval: {replicates: 1000, level: 0.95}
readout: category-terms
astar: {strategy: {kind: binary}, root_mode: {kind: goal}, heuristic: {kind: supertag-outside}, proposer: {kind: supertag-beam}}
decode: {kind: viterbi}
derivation_counts: false
dependency_interpretation: dependency
labels: [S, NP]
lengths: [1, 2, 3, 4, 5]
depths: [0, 1, 2, 3, 4]
attachment_band: all
attachment_limit: null
attachment_direction: directed
dependency_mode: labeled-directed
dependency_measure: f-score
conventions: {punctuation: keep, unary_chains: keep, trivial_spans: keep, minimum_length: 0, aggregation: sentence, coverage: zero, self_arcs: allow, gold_derivation: canonical}
