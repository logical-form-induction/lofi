defaults: [prover-enumerated]
scorer:
  kind: model-checking
  source:
    kind: given
    knowledge_base:
      kind: wikidata
      snapshot: lofi.resource:data/knowledge_base/wikidata-mini.jsonl
      mapping: lofi.resource:data/knowledge_base/wikidata-mini.mapping.json
      world: closed
      unmapped: undecided
    full_function_space_cap: 64
    henkin_pool: 8
  logic:
    tnorm: product
    implication: residuum
    quantifier: extreme
    equality: crisp
    margin: 0.0
  truth_threshold: 0.5
  abstain_band: 0.0
  premise_floor: 0.5
  unsatisfied_premise: undecided
