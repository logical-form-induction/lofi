name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # a fully pinned environment is not the same as an installable one: a yanked
    # wheel, a withdrawn release or a runner image change breaks the install with
    # no commit to blame. Weekly is often enough to learn that on a Monday rather
    # than on the day an experiment needs to run.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# the default token is read and write. Nothing here writes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # A new pull request commit supersedes its previous run. Main commits run
  # independently, so an older run cannot block validation of a newer commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

jobs:
  static:
    name: Format, lint, types, layering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nothing here pushes, so the token has no reason to survive in the
          # local git config where a build step could read it.
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Rust toolchain
        # with no argument, rustup installs the toolchain rust-toolchain.toml
        # pins, so `uv sync` builds the extension with that compiler and not with
        # whichever one the runner image ships.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install
        # `--locked` is `--frozen` plus the assertion that the lockfile still
        # matches pyproject.toml, so a dependency edit that was never relocked
        # fails here instead of resolving differently on the next machine.
        run: uv sync --locked

      # each check reports even when an earlier one failed, so one run says how
      # much is wrong rather than how much is wrong up to the first failure.
      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run ruff check .

      - name: Types
        if: ${{ !cancelled() }}
        # Documentation hooks have a separate dependency environment. Make its
        # packages visible to ty without adding them to LoFI's dependencies.
        run: |
          uv run --with-requirements docs/requirements.txt python - <<'PY'
          from pathlib import Path
          import subprocess
          import markdown

          subprocess.run([
              "ty", "check", "--error-on-warning", "--extra-search-path",
              str(Path(markdown.__file__).parent.parent),
          ], check=True)
          PY

      - name: Layering
        if: ${{ !cancelled() }}
        run: uv run lint-imports

  test:
    name: Tests (${{ matrix.os }})
    # the full suite runs on each supported operating system. The static gates
    # and the variant runs below read the source or the interpreter, not the
    # platform, and run once on Linux.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Rust toolchain
        # with no argument, rustup installs the toolchain rust-toolchain.toml
        # pins, so `uv sync` builds the extension with that compiler and not with
        # whichever one the runner image ships.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install
        run: uv sync --locked

      - uses: ./.github/actions/setup-vampire
      - uses: ./.github/actions/setup-z3

      - name: Tests
        # the wider Hypothesis profile is declared in tests/conftest.py for this
        # job: a search worth two hundred examples earns its runtime once per
        # push and not on every local iteration.
        env:
          HYPOTHESIS_PROFILE: ci
          LOFI_CHECK: "1"
        # a hosted runner's speed varies from run to run, so the absolute
        # wall-clock budgets are disabled on hosted machines.
        run: uv run pytest -o wall_clock_budgets=false --cov=lofi --cov-report=term-missing

  determinism:
    name: Determinism
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Rust toolchain
        # with no argument, rustup installs the toolchain rust-toolchain.toml
        # pins, so `uv sync` builds the extension with that compiler and not with
        # whichever one the runner image ships.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install
        run: uv sync --locked

      - uses: ./.github/actions/setup-vampire
      - uses: ./.github/actions/setup-z3

      - name: Determinism
        env:
          HYPOTHESIS_PROFILE: ci
          LOFI_CHECK: "1"
        run: uv run python scripts/ci/determinism.py --model-seed 0

  test-optimized:
    name: Tests under python -O
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Rust toolchain
        # with no argument, rustup installs the toolchain rust-toolchain.toml
        # pins, so `uv sync` builds the extension with that compiler and not with
        # whichever one the runner image ships.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install
        run: uv sync --locked

      - uses: ./.github/actions/setup-vampire
      - uses: ./.github/actions/setup-z3

      - name: Tests
        # `-O` strips every `assert`, so validation written as one stops raising
        # and the test expecting that error fails. This job is the only thing
        # that can tell the difference.
        env:
          LOFI_CHECK: "1"
        run: uv run python -O -m pytest -o wall_clock_budgets=false

  test-unchecked:
    name: Tests with the debug checks off
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Rust toolchain
        # with no argument, rustup installs the toolchain rust-toolchain.toml
        # pins, so `uv sync` builds the extension with that compiler and not with
        # whichever one the runner image ships.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install
        run: uv sync --locked

      - uses: ./.github/actions/setup-vampire
      - uses: ./.github/actions/setup-z3

      - name: Tests
        # the coarse-grained checks behind LOFI_CHECK are a development aid that
        # a production run leaves off. A test passing only while they are on is
        # a test of the aid.
        env:
          LOFI_CHECK: "0"
        run: uv run pytest -o wall_clock_budgets=false

  independence:
    name: Symbolic core without a tensor library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Rust toolchain
        # with no argument, rustup installs the toolchain rust-toolchain.toml
        # pins, so `uv sync` builds the extension with that compiler and not with
        # whichever one the runner image ships.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install the distribution alone
        # no extras and no development group, which is what `pip install lofi`
        # gets. A tensor library is absent from the environment rather than
        # hidden from the importer, so nothing here has to be taken on trust.
        run: uv sync --locked --no-default-groups

      - name: Verify the cross-engine skip without its extra
        run: |
          uv run --no-sync --with pytest --with hypothesis \
            python -m pytest -o addopts="" --run-integration -rs \
            tests/integration/test_quivers_agreement.py

      - name: Import the symbolic core
        run: |
          uv run --no-sync python - <<'PY'
          import importlib
          import importlib.util
          import pkgutil

          CORE = (
              "lofi.terms",
              "lofi.judge",
              "lofi.lexicon",
              "lofi.deduce",
              "lofi.interpret",
              "lofi.formalism",
              "lofi.grammars",
          )
          ABSENT = ("torch", "numpy", "quivers", "lairs", "bead", "hypothesis")


          def reraise(name):
              raise


          present = [n for n in ABSENT if importlib.util.find_spec(n) is not None]
          if present:
              message = f"{', '.join(present)} installed, so this proves nothing"
              raise SystemExit(message)

          for name in CORE:
              package = importlib.import_module(name)
              walk = pkgutil.walk_packages(package.__path__, f"{name}.", reraise)
              for module in walk:
                  # a law suite states its properties with Hypothesis, which the
                  # `laws` extra provides and this environment deliberately lacks.
                  if module.name.rpartition(".")[2] == "laws":
                      continue
                  importlib.import_module(module.name)
          PY
