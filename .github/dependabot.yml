version: 2

updates:
  # actions are pinned to a commit SHA, which is the supply-chain control and
  # also the thing nobody updates by hand. Dependabot rewrites the pin and the
  # trailing version comment together, so the pin stays current and readable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  # pyproject.toml and uv.lock together. Routine bumps arrive as one pull
  # request a week so that the interesting one, a major, arrives alone.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
