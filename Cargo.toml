[workspace]
resolver = "3"
members = ["crates/lofi-chart", "crates/lofi-grammar", "crates/lofi-native"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# the supported compiler is the one rust-toolchain.toml pins. Both move together.
rust-version = "1.99"
license = "MIT"
authors = ["Aaron Steven White <aaronstevenwhite@gmail.com>"]
repository = "https://github.com/logical-form-induction/lofi"
homepage = "https://github.com/logical-form-induction/lofi"
readme = "README.md"
keywords = ["ccg", "chart-parsing", "grammar-induction", "semiring"]
categories = ["science", "text-processing"]
# the crates are build details of the one `lofi` Python distribution.
publish = false

[workspace.dependencies]
lofi-chart = { path = "crates/lofi-chart" }
lofi-grammar = { path = "crates/lofi-grammar" }
indexmap = { version = "2.13.0", features = ["serde"] }
pyo3 = { version = "0.30.1", default-features = false, features = ["num-bigint"] }
gungraun = "0.20.0"
num-bigint = "=0.4.6"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rayon = "1.12.0"
ryu = "1.0.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
sha2 = "0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
# gungraun's #[library_benchmark] expands to a qualified call that carries the
# benchmark function's own span, so rustc reports it in the benchmark source,
# where no edit can remove it
unused_qualifications = "allow"
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# restriction picks: each forbids a construct that panics or hides a decision
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
missing_assert_message = "deny"
# ids widen through From and TryFrom, never `as`
as_conversions = "deny"
# group members switched off, each with its reason
# chart::ChartError reads better than chart::Error at the boundary
module_name_repetitions = "allow"
# decided by cargo-deny's [bans], which can name exceptions
multiple_crate_versions = "allow"

[profile.release]
lto = "thin"
codegen-units = 16
# a panic in the extension becomes a Python exception instead of aborting the
# interpreter
panic = "unwind"

# the wheels CI publishes
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# release code with line tables, for a sampling profiler
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
