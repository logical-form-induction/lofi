[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

# the Rust workspace under crates/ builds the one extension module, lofi._native,
# beside the Python package at the repository root.
[tool.maturin]
manifest-path = "crates/lofi-native/Cargo.toml"
module-name = "lofi._native"
# every build compiles the committed Cargo.lock, as every install resolves uv.lock.
locked = true
profile = "release"
# an editable install is what the tests and the benchmarks run against, and a
# debug build would time the compiler's defaults rather than the kernel.
editable-profile = "release"
# Local files are never part of a release distribution.
exclude = [".local/**"]
# a source build compiles with the toolchain the repository pins.
include = [{ path = "rust-toolchain.toml", format = "sdist" }]

[tool.uv]
# uv rebuilds the project only when a cache key changes. The extension is built
# from these files, so an edit to any of them rebuilds it on the next sync. A
# file key compares modification times, which a deleted file does not move, so
# the directory key is what makes a missing crates/ rebuild, and fail.
cache-keys = [
    { dir = "crates" },
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "hypothesis",
    "import-linter",
    "pre-commit",
    "pyyaml",
    "lofi[nn]",
    "lofi[corpora]",
    "lofi[cross-engine]",
    "lofi[judgments]",
    "lofi[tracking]",
  "lofi[provers]",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["lofi", "tests", "scripts"]
# Local files are excluded. The extension's stub is maturin's output,
# regenerated from the compiled module and read by ty.
extend-exclude = [".local", "lofi/_native.pyi"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # mutually exclusive with D211; ruff refuses to run with both on
    "D213",   # mutually exclusive with D212; likewise
    "COM812", # ruff documents this as incompatible with `ruff format`
    "ISC001", # likewise
    "CPY001", # the LICENSE states the terms once; no substrate package carries per-file headers
    "PLR2004", # a literal at its use site is normal Python; naming every one produced 97 single-use constants
    "PLR0913", # a constructor that injects one argument per port takes as many arguments as it has ports
    "PLR0917", # likewise for positional count
    "C901",    # the closure engine and proof search are the algorithms; splitting them for a metric obscures them
    "PLR0912", # likewise: branch count in the proof search
    "PLR0915", # likewise: statement count in the proof search
    "S311",    # random here is for reproducible synthetic data, never for security
]

[tool.ruff.lint.isort]
# `src` names the roots modules resolve against, which leaves the distribution's
# own package looking third-party to the import sorter.
known-first-party = ["lofi"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-type-checking]
# didactic reads a Model's field annotations at class creation, so its imports are runtime imports.
# ruff resolves only a class's direct bases, so a variant of a component root
# declared in another module names that root here.
runtime-evaluated-base-classes = [
    "didactic.api.Model",
    "didactic.api.TaggedUnion",
    "didactic.api.Settings",
    "lofi.spec.components.baseline.BaselineSystemSpec",
    "lofi.spec.components.data.DatasetSpec",
    "lofi.spec.components.model.ReadoutSpec",
    "lofi.spec.components.model.PairScorerSpec",
    "lofi.spec.components.model.GroundingSpec",
    "lofi.spec.components.model.ParserSpec",
    "lofi.spec.components.model.TermDecoderSpec",
    "lofi.spec.components.model.TermEncoderSpec",
    "lofi.spec.components.model.TokenEncoderSpec",
    "lofi.spec.components.run.EvaluatorSpec",
    "lofi.spec.components.run.ProbeSpec",
    "lofi.spec.components.trainer.TrainerSpec",
    "lofi.spec.lexicon_generators.LexiconGeneratorSpec",
    "lofi.spec.structures.sampled.StructureSourceSpec",
]

[tool.ruff.lint.flake8-tidy-imports]
# an import climbing more than one level is the shape a layering violation takes.
# forbidding it forces the same edge to be written absolutely, where import-linter sees it.
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use dx.TaggedUnion, PEP 695 generics, a concrete union, a Protocol, or JsonValue."
"inspect.signature".msg = "Signature reflection is not dispatch. Register with an explicit string tag."
"inspect.getmembers".msg = "Reflection over members is not dispatch."
"torch.set_default_device".msg = "No global torch mutation."
"torch.set_default_dtype".msg = "No global torch mutation."
"torch.cuda.is_available".msg = "Device selection happens once, in the run policy."

[tool.ruff.lint.per-file-ignores]
# the launcher runs the site profile's declared submit and transport commands as an
# argument vector, never shell text, so the subprocess audit rule does not apply (S603).
"lofi/run/_launch.py" = ["S603"]
# the execution environment runs git with fixed argument vectors and no shell to
# read and verify the executing checkout's revision (S603).
"lofi/run/_environment.py" = ["S603"]
# These modules execute a validated absolute prover path with fixed argument
# vectors and no shell interpolation; subprocesses are their public boundary.
"lofi/lf/provers/smt.py" = ["S603"]
"lofi/lf/provers/tptp.py" = ["S603"]
# the public-release preflight runs four named tools with fixed argument vectors and
# no shell interpolation; subprocess is the boundary it is specifically checking.
"scripts/preflight/public_release.py" = ["S603"]
# the freeze command runs git with fixed argument vectors and no shell, reading
# tracked blobs as exact bytes and feeding the tag object on standard input (S603).
"lofi/run/freezing.py" = ["S603"]
# This conformance law must turn any third-party manifest failure into a named law
# failure so the backend and violated law remain visible.
"tests/conformance/experiment_manifest.py" = ["BLE001"]
# tests assert, compare against bare numbers, and need no API docstrings.
# a test that pickles a value it built itself is not deserializing untrusted data (S301).
"tests/**" = [
    "S101",
    "PLR2004",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "INP001",
    "S301",
    # Tests launch fixed local interpreters and fixtures, never user-controlled programs.
    "S603",
]
# contract tests inspect callable surfaces; they do not dispatch at runtime.
"tests/contract/**" = ["TID251"]
# a didactic eliminator body is a lambda whose parameters must name every input in
# declaration order, and a case branch one per binder, whether or not the body
# reads them; ARG005 reads a required name as an unused one.
"tests/conventions/test_substrate.py" = ["ARG005"]
# This test deliberately aggregates arbitrary backend failures to assert symmetry.
"tests/conformance/response_backend.py" = ["BLE001"]
# This concurrency test must transport even BaseException failures from worker
# threads and re-raise the original failure on the controlling thread.
# These focused tests inspect parse-local dispatch and memoization by design.
"tests/unit/deduce/test__engine.py" = ["SLF001"]
# the frozen-value suite checks that each value's refusal messages name the noun and
# the cause the class declares, which means reading those declarations (SLF001).
"tests/conformance/frozen.py" = ["SLF001"]
# declaration modules hold value declarations rather than behavior. PLR0913 and PLR0917
# count arguments as a heuristic aimed at a behavioral function whose parameter list has
# grown untended; a record with six fields has six because the thing it describes has six
# properties, and splitting that constructor would split the concept.
"lofi/**/_values.py" = ["PLR0913", "PLR0917"]
"lofi/**/_ports.py" = ["PLR0913", "PLR0917"]
# the report API names each parser dependency; packing them would hide public ports.
"lofi/deduce/_report.py" = ["PLR0913"]
# S311 warns that the standard pseudo-random generator is unsuitable for
# cryptography. Resampling inference is not cryptography: a permutation test and
# a bootstrap need a reproducible stream from a declared seed, which is exactly
# what random.Random gives and what a cryptographic source would not.
"lofi/stats/**" = ["S311"]

[tool.ty.src]
# Local files are excluded from source checking.
# The extension's stub is maturin's output: ty resolves imports through it but does
# not check its layout.
exclude = [".local", "lofi/_native.pyi"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
# every rule that does not already default to error is promoted to one.
ambiguous-protocol-member = "error"
blanket-ignore-comment = "error"
deprecated = "error"
division-by-zero = "error"
experimental-syntax = "error"
ignore-comment-unknown-rule = "error"
ineffective-final = "error"
invalid-enum-member-annotation = "error"
invalid-ignore-comment = "error"
invalid-legacy-positional-parameter = "error"
invalid-named-tuple-override = "error"
mismatched-type-name = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-implicit-call = "error"
possibly-missing-import = "error"
possibly-missing-submodule = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
redundant-final-classvar = "error"
subclass-of-dataclass-with-order = "error"
undefined-reveal = "error"
unresolved-global = "error"
unresolved-import = "error"
unresolved-reference = "error"
unsupported-base = "error"
unsupported-dynamic-base = "error"
unused-awaitable = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
useless-overload-body = "error"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
    "--benchmark-skip",
    "--benchmark-storage=tests/benchmarks/baselines",
]
testpaths = ["tests"]
pythonpath = ["."]
# a benchmark's absolute wall-clock budget holds on the fixed benchmark machine.
# the hosted comparison of a commit against its parent sets this false and gates
# on the relative regression instead.
wall_clock_budgets = true
markers = [
    "integration: real IO, optional deps or credentials (needs --run-integration)",
    "slow: long-running (needs --run-slow)",
    "generality: trains on large generated declarations (needs --run-generality)",
    "conformance: a protocol conformance suite run against one implementation",
    "corpus: needs a licensed corpus named by an environment variable",
]

[tool.coverage.run]
branch = true
source = ["lofi"]

[tool.coverage.report]
# a smoke alarm on the unit job, not a target. coverage is never in addopts,
# because tracing inflates the benchmark timings several-fold.
fail_under = 80
show_missing = true
