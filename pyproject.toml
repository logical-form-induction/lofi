[project]
name = "lofi"
version = "0.1.0"
description = "Induction of typed logical forms from inferential annotation."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Steven White", email = "aaronstevenwhite@gmail.com" }]
keywords = [
    "categorial grammar",
    "ccg",
    "grammar induction",
    "logical form",
    "semantics",
    "computational psycholinguistics",
    "nlp",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
# the base install is three pure-Python packages and nothing else: didactic, its
# settings layer and panproto. that is what makes the symbolic core installable
# and usable on its own; anything added here is added to every install of it.
# didactic-settings reads JSON on its own and YAML only through its yaml extra,
# which nothing in the base needs, so the extra stays out of it.
dependencies = [
    "didactic>=0.18.1",
    "didactic-settings>=0.18.1",
    "panproto>=0.76.1",
]

# an extra names a capability someone asks for, and declares only what that
# capability imports directly. two capabilities may share a wheel: quivers
# requires torch, so `judgments` gets torch too, without `nn` naming quivers.
[project.optional-dependencies]
nn = ["numpy>=2", "torch>=2", "transformers[sentencepiece]>=4"]
corpora = ["lairs[conllu]>=0.9.0"]
cross-engine = ["quivers>=0.25.2"]
# quivers[diagnostics] rather than plain quivers: the PSIS-LOO and ELPD comparison
# in lofi.eval calls quivers.diagnostics.compare, which quivers puts behind its own
# diagnostics extra because it needs arviz. Without it the import fails at the point
# a model comparison is run rather than at install. The calibration reducer calls
# scipy.stats.kstest directly, so scipy is likewise a direct judgments dependency.
judgments = [
    "bead>=0.12.0",
    "quivers[diagnostics]>=0.25.2",
    "scipy>=1.18",
    "torchdiffeq>=0.2.5",
]
reporting = ["pyarrow>=25"]
publish = [
    "huggingface-hub>=2.4.0",
    "lairs>=0.9.0",
    "numpy>=2",
    "torch>=2",
    "transformers[sentencepiece]>=4",
]
tracking = ["wandb", "mlflow", "trackio"]
# the law suites under lofi.*.laws are exported so a plugin author can check an
# implementation against them, and they check properties with Hypothesis. No package
# imports them, so the base install stays didactic and panproto.
laws = ["hypothesis>=6"]
# The SMT arm runs the z3 executable installed by this wheel. TPTP users may
# select E or Vampire from their site environment through the same prover API.
provers = ["z3-solver>=4.15"]

[project.urls]
Homepage = "https://github.com/logical-form-induction/lofi"
Repository = "https://github.com/logical-form-induction/lofi"
Issues = "https://github.com/logical-form-induction/lofi/issues"

[project.scripts]
lofi = "lofi.run._entrypoint:main"

# A component family registers its declaration root once. Each variant then
# registers one plugin object under the group named by that root's family.
[project.entry-points."lofi.families"]
active_collector = "lofi.spec.acquisition.collectors:ActiveCollectorSpec"
baseline_system = "lofi.spec.components.baseline:BaselineSystemSpec"
batch_sampler = "lofi.spec.components.trainer:BatchSamplerSpec"
constraint_source = "lofi.spec.components.data:ConstraintSourceSpec"
controller = "lofi.spec.components.model:ControllerSpec"
chart = "lofi.spec.components.model:ParserSpec"
dataset = "lofi.spec.components.data:DatasetSpec"
evaluator = "lofi.spec.components.run:EvaluatorSpec"
featurizer = "lofi.spec.components.data:FeaturizerSpec"
gold_aggregation = "lofi.spec.components.data:GoldAggregationSpec"
grounding = "lofi.spec.components.model:GroundingSpec"
loss = "lofi.spec.components.loss:LossSpec"
optimizer = "lofi.spec.components.trainer:OptimizerSpec"
pair_sampler = "lofi.spec.components.trainer:PairSamplerSpec"
pair_scorer = "lofi.spec.components.model:PairScorerSpec"
probe = "lofi.spec.components.run:ProbeSpec"
prover = "lofi.spec.provers:ProverSpec"
readout = "lofi.spec.components.model:ReadoutSpec"
scheduler = "lofi.spec.components.trainer:SchedulerSpec"
sink = "lofi.spec.components.run:SinkSpec"
span_decoder = "lofi.spec.components.model:SpanDecoderSpec"
subword_pooler = "lofi.spec.components.model:SubwordPoolerSpec"
term_decoder = "lofi.spec.components.model:TermDecoderSpec"
term_encoder = "lofi.spec.components.model:TermEncoderSpec"
token_encoder = "lofi.spec.components.model:TokenEncoderSpec"
tokenizer = "lofi.spec.components.data:TokenizerSpec"
trainer = "lofi.spec.components.trainer:TrainerSpec"
type_sampler = "lofi.spec.components.trainer:TypeSamplerSpec"

# Interpolation callables register by the exact name used in a document.
[project.entry-points."lofi.resolver"]
"lofi.path" = "lofi.spec._interpolation:_lofi_path"
"lofi.pkg" = "lofi.spec._interpolation:_lofi_pkg"
"lofi.seed" = "lofi.spec._interpolation:_lofi_seed"

# A plugin author discovers the same conformance modules the package documents
# through this group.  They stay outside runtime imports and require the laws
# extra only when loaded.
[project.entry-points."lofi.laws"]
data = "lofi.data.laws"
deduction = "lofi.deduce.laws"
evaluation = "lofi.eval.laws"
interpretation = "lofi.interpret.laws"
judgment = "lofi.judge.laws"
lexicon = "lofi.lexicon.laws"
neural-loss = "lofi.nn.loss.laws"
probe = "lofi.probe.laws"
run = "lofi.run.laws"
statistics = "lofi.stats.laws"
terms = "lofi.terms.laws"
training = "lofi.train.laws"
typing = "lofi.typecheck.laws"

# a distribution contributing configuration groups lists the package directory
# holding them here.
[project.entry-points."lofi.config_dirs"]

# Rule families publish their conformance cases through this group.
[project.entry-points."lofi.rule_family"]
