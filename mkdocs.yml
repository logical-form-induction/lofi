site_name: LoFI
site_description: Induction of categorial grammars and typed logical forms from declared data.
site_url: https://logical-form-induction.github.io/lofi/
site_author: Aaron Steven White
repo_url: https://github.com/logical-form-induction/lofi
repo_name: logical-form-induction/lofi
edit_uri: edit/main/docs/
copyright: LoFI is open source under the MIT License.

# a warning is a broken cross-reference or a symbol the API pages ask for and
# cannot find, so the build treats one as an error. `mkdocs build --strict` on
# the command line sets the same thing; this makes a local `mkdocs serve` agree.
strict: true

# The contributor writing guide is kept with the documentation source.
exclude_docs: |
  STYLE.md

theme:
  name: material
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/logical-form-induction/lofi
      name: LoFI on GitHub

extra_css:
  - css/custom.css

extra_javascript:
  - js/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js
  - js/mermaid-init.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true
      guess_lang: false
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # the flat layout: the import package sits at the repository root.
          paths:
            - .
          options:
            docstring_style: numpy
            docstring_options:
              # a value type here is a NamedTuple whose fields are documented in
              # the Parameters section the numpy convention puts a constructor's
              # arguments in. there is no written-out signature to match those
              # fields against, so the parser reports each one as unknown and
              # untyped, twice per field. every parameter in the tree is
              # annotated in its signature, which ruff enforces, so these two
              # warnings can say nothing else here. what strict mode is for, an
              # identifier a page asks for and cannot resolve, is unaffected.
              warn_unknown_params: false
              warn_missing_types: false
            docstring_section_style: spacy
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            inherited_members: false
            members_order: source
            heading_level: 2
            filters:
              - "!^_"

