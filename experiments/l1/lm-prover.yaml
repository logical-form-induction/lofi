role: logical-form-baseline
freeze_id: freeze/1
config: {kind: baseline-fit, path: lm-prover-fit.json}
launch: {kind: serial}
failure: {numerical: final, out_of_memory: retry}
sweep:
  grid: []
  seeds: [0, 1, 2, 3]
  expected_points: 4
seed_policy: {root: 108}
rows: &baseline-rows
  - {evaluator: baseline, metric: logical-form-normal-form}
  - {evaluator: baseline, metric: many-to-one-accuracy}
  - {evaluator: baseline, metric: random-relabeling-floor}
  - {evaluator: baseline, metric: inference-accuracy}
  - {evaluator: baseline, metric: inference-coverage}
  - {evaluator: baseline, metric: prover-calls}
  - {evaluator: baseline, metric: prover-memo-hit-rate}
  - {evaluator: baseline, metric: prover-cpu-seconds}
  - {evaluator: baseline, metric: prover-abstention-rate}
primary: {evaluator: baseline, metric: inference-accuracy}
preregistration: lm-prover.json
compute: {kind: unpriced}
contraction:
  rungs: [{kind: fallback}]
  factorial: LINC voting over the held-out inference pairs
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-03-15"
  signal:
    kind: metric
    row: {evaluator: baseline, metric: inference-accuracy}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: The recorded LM formalizations yield no decided inference predictions.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 4
  seed_budget: {metric: inference-accuracy, target: mean, precision: 0.1, level: 0.95}
