role: logical-form-lexicon
freeze_id: freeze/1
config: {kind: run, path: l1-run.yaml}
launch: {kind: serial}
failure: {numerical: final, out_of_memory: retry}
sweep:
  grid:
    - group: model.grounding
      values: [prover-enumerated, nli-baseline]
  seeds: [0]
  expected_points: 2
seed_policy: {root: 108}
rows:
  - {evaluator: category-side, metric: supertag-accuracy}
  - {evaluator: category-side, metric: "dependency:labeled-directed:zero:micro-f-score"}
  - {evaluator: category-side, metric: lexical-type-f1}
  - {evaluator: category-side, metric: primitive-one-to-one-accuracy}
  - {evaluator: category-side, metric: primitive-random-relabeling-floor}
  - {evaluator: logical-forms, metric: logical-form-normal-form}
  - {evaluator: logical-forms, metric: many-to-one-accuracy}
  - {evaluator: logical-forms, metric: random-relabeling-floor}
  - {evaluator: logical-forms, metric: fiber-relative-recovery}
  - {evaluator: logical-forms, metric: fixed-vocabulary-accuracy}
  - {evaluator: logical-forms, metric: fiber-floor}
  - {evaluator: logical-forms, metric: fiber-size}
primary: {evaluator: logical-forms, metric: fiber-relative-recovery}
preregistration: reduced-freeze.json
factors:
  treatment:
    axis: model.grounding
    levels:
      - {level: induced-with-prover, value: prover-enumerated}
      - {level: nli-baseline, value: nli-baseline}
compute: {kind: unpriced}
contraction:
  rungs: [{kind: fallback}]
  factorial: theorem-prover induction beside a standard NLI baseline
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-03-15"
  signal:
    kind: metric
    row: {evaluator: logical-forms, metric: fiber-relative-recovery}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: Known-grammar inference training does not recover lexical logical forms above zero.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 1
  seed_budget: {metric: fiber-relative-recovery, target: mean, precision: 0.2, level: 0.95}
