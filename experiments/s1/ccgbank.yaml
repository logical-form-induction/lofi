role: known-grammar-lexicon-induction
freeze_id: freeze/1
config: {kind: run, path: s1-run.yaml}
launch: {kind: array, chunk_size: 1, throttle: 32}
failure: {numerical: final, out_of_memory: halve-batch}
sweep:
  yoked:
    - - path: model.parser.attend
        values:
          - {kind: marginal}
          - {kind: attend}
          - {kind: marginal}
          - {kind: marginal}
          - {kind: marginal}
      - path: model.decoders.identity
        values:
          - &recursive {kind: tree-rnn, width: 16}
          - *recursive
          - *recursive
          - *recursive
          - {kind: linear-rnn, width: 16, choice_heads: factored}
      - path: loss.terms
        values:
          - &induction-loss
            - objective:
                kind: coherence
                readout: category-terms
                space: categories
                estimator: truncated
                warmup: null
          - - {objective: {kind: outside-reconstruction, decoder: reconstruction}}
          - *induction-loss
          - *induction-loss
          - *induction-loss
      - path: data.datasets.train.constraint_policy.syntactic
        values:
          - &unsupervised {ambiguity: union, coverage: 0.0}
          - *unsupervised
          - {ambiguity: union, coverage: 1.0}
          - &token-supervision {ambiguity: per-occurrence, coverage: 1.0, seed: 0}
          - *token-supervision
      - path: data.datasets.train.constraint_source
        values:
          - &gold-lexicon {kind: gold-lexicon, policy: syntactic}
          - null
          - *gold-lexicon
          - *gold-lexicon
          - *gold-lexicon
      - path: trainer
        values:
          - &baseline-trainer
            kind: staged
            validation_stage: parser
            base:
              kind: parser
              dataset: train
              epochs: 2
              batch_size: 4
              accumulation_steps: 1
              batch_sampler: {kind: length-bucket, bucket_factor: 100, reshuffle_each_epoch: false}
              max_grad_norm: null
              active_groups: null
              early_stopping: {metric: loss/coherence, mode: min, patience: 2, minimum_delta: 0.0, keep_best: 1}
              checkpoints: {interval: 1, keep: 1}
            stages:
              - name: lexical-constraints
                step: {kind: token-warm-up, name: lexical-constraints, dataset: train, space: categories}
                active_groups: [token_encoder, terms, identity]
                epochs: 1
              - name: parser
                step: {kind: parser, name: parser, dataset: train}
                active_groups: [token_encoder, terms, identity, application, controller, parser]
                epochs: 1
          - kind: parser
            dataset: train
            epochs: 1
            batch_size: 4
            accumulation_steps: 1
            batch_sampler: {kind: length-bucket, bucket_factor: 100, reshuffle_each_epoch: false}
            max_grad_norm: null
            active_groups: [token_encoder, parser, reconstruction]
            early_stopping: {metric: loss/outside-reconstruction, mode: min, patience: 2, minimum_delta: 0.0, keep_best: 1}
            checkpoints: {interval: 1, keep: 1}
          - *baseline-trainer
          - *baseline-trainer
          - *baseline-trainer
  grid:
    - path: model.encoders.terms
      values:
        - {kind: tree-rnn, width: 16, layers: 1, norm_cap: null}
        - {kind: hrr, width: 16}
        - {kind: transformer, width: 16, heads: 4, layers: 1, feedforward_width: 32, structure: ancestor-and-sibling-bias, norm_cap: null}
    - path: model.capacity.target
      values: [250000, 500000]
  seeds: [0, 1, 2, 3]
  expected_points: 120
seed_policy: {root: 111}
rows:
  - {evaluator: lexical, metric: supertag-accuracy}
  - {evaluator: structural, metric: "dependency:labeled-directed:zero:micro-f-score"}
  - {evaluator: types, metric: lexical-type-f1}
  - {evaluator: types, metric: primitive-one-to-one-accuracy}
  - {evaluator: types, metric: primitive-random-relabeling-floor}
  - {evaluator: types, metric: constructor-one-to-one-accuracy}
  - {evaluator: types, metric: constructor-random-relabeling-floor}
  - {evaluator: lexical, metric: supertag-accuracy-frequency-unseen}
  - {evaluator: lexical, metric: supertag-accuracy-frequency-rare}
  - {evaluator: lexical, metric: supertag-accuracy-frequency-frequent}
  - {evaluator: lexical, metric: supertag-accuracy-ambiguity-unseen}
  - {evaluator: lexical, metric: supertag-accuracy-ambiguity-unambiguous}
  - {evaluator: lexical, metric: supertag-accuracy-ambiguity-ambiguous}
primary: {evaluator: types, metric: primitive-one-to-one-accuracy}
preregistration: ccgbank.json
factors:
  encoder:
    axis: model.encoders.terms
    levels:
      - {level: tree-rnn, value: {kind: tree-rnn, width: 16, layers: 1, norm_cap: null}}
      - {level: hrr, value: {kind: hrr, width: 16}}
      - {level: transformer, value: {kind: transformer, width: 16, heads: 4, layers: 1, feedforward_width: 32, structure: ancestor-and-sibling-bias, norm_cap: null}}
  capacity: {axis: model.capacity.target}
compute: {kind: unpriced}
contraction:
  rungs:
    - {kind: seeds, floor: 4}
    - {kind: fallback}
  factorial: five learner configurations crossed with three term encoders and two matched parameter counts
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-02-15"
  signal:
    kind: metric
    row: {evaluator: types, metric: primitive-one-to-one-accuracy}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: Known-grammar lexical recovery does not exceed a nonzero aligned score.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 4
  seed_budget: {metric: primitive-one-to-one-accuracy, target: mean, precision: 0.05, level: 0.95}
