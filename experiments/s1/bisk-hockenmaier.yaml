role: known-grammar-baseline
freeze_id: freeze/1
config: {kind: baseline-fit, path: bisk-hockenmaier-fit.json}
launch: {kind: serial}
failure: {numerical: final, out_of_memory: retry}
sweep:
  grid: []
  seeds: [0, 1, 2, 3]
  expected_points: 4
seed_policy: {root: 114}
rows:
  - {evaluator: baseline, metric: supertagging-length-10}
  - {evaluator: baseline, metric: dependencies-length-10}
  - {evaluator: baseline, metric: supertagging-length-20}
  - {evaluator: baseline, metric: dependencies-length-20}
  - {evaluator: baseline, metric: supertagging-all-lengths}
  - {evaluator: baseline, metric: dependencies-all-lengths}
primary: {evaluator: baseline, metric: dependencies-all-lengths}
preregistration: bisk-hockenmaier.json
compute: {kind: unpriced}
contraction:
  rungs:
    - {kind: seeds, floor: 4}
    - {kind: fallback}
  factorial: the published inducer under four independent run seeds
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-02-15"
  signal:
    kind: metric
    row: {evaluator: baseline, metric: dependencies-all-lengths}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: The published inducer does not recover a dependency score above zero.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 4
  seed_budget: {metric: dependencies-all-lengths, target: mean, precision: 0.05, level: 0.95}
