# A capacity-matched parser point shared by the lexical-distribution campaigns.
defaults:
  - data.datasets.train.dataset: s3-source
parse: {retain: forest, reachability: all}
approximation: {residual_mass: 0.75}
model:
  language: {from: data}
  capacity: {kind: parameter-count, target: 250000}
  parser: {kind: inside-outside, width: 4}
  token_encoder: {kind: learned, width: 4}
  subword_pooler: {kind: first}
  controller: {kind: mlp, hidden: [{width: 4, activation: tanh}]}
  encoders:
    terms: {kind: tree-rnn, width: 4, layers: 1, norm_cap: null}
  decoders:
    identity: {kind: tree-rnn, width: 4}
    application: {kind: tree-rnn, width: 4}
  spaces:
    categories:
      sort: Cat
      encoder: terms
      identity: identity
      combinators:
        merge: concatenate
        decoders:
          "application:/": application
          "application:\\": application
  readouts:
    types:
      kind: terms
      space: categories
      reads: inside
      targets: grammar-goal
      output: sentences
    category-terms:
      kind: terms
      space: categories
      reads: inside
      decoding: {strategy: exhaustive, cap: 64}
loss:
  terms:
    - objective: {kind: grammaticality, readout: sentences}
    - objective:
        kind: coherence
        readout: category-terms
        space: categories
        estimator: truncated
        warmup: null
      weight: 0.1
data:
  datasets:
    train:
      featurizer: {kind: unlabeled}
trainer:
  kind: parser
  dataset: train
  epochs: 1
  batch_size: 4
  batch_sampler: {kind: length-bucket, bucket_factor: 100, reshuffle_each_epoch: false}
  max_grad_norm: null
  active_groups: [token_encoder, terms, identity, application, controller, parser]
  early_stopping:
    metric: loss/grammaticality
    mode: min
    patience: 2
    minimum_delta: 0.0
    keep_best: 1
  checkpoints: {interval: 1, keep: 1}
release: {checkpoint: validation-best}
optimizer: {kind: adamw, weight_decay: 0.0}
device_policy:
  device: cpu
  compute_dtype: float32
  deterministic: true
  matmul_precision: highest
  activation_memory_bytes: 8000000000
evaluators:
  lexical-recovery:
    kind: lexical-types
    interval: {replicates: 50, level: 0.95}
    readout: category-terms
    alignment:
      kind: many-to-one
      tie_break: largest-gold-marginal
      fit_on: dev
      score_on: test
      random_floor: {replicates: 50, level: 0.95}
      stability: {replicates: 50, level: 0.95}
    conventions:
      punctuation: keep
      unary_chains: keep
      trivial_spans: keep
      minimum_length: 0
      aggregation: sentence
      coverage: zero
      self_arcs: allow
      gold_derivation: canonical
