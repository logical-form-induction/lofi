role: lexical-distribution
freeze_id: freeze/1
config: {kind: run, path: s3-run.yaml}
launch: {kind: array, chunk_size: 1, throttle: 32}
failure: {numerical: final, out_of_memory: retry}
sweep:
  grid:
    - path: data.datasets.train.dataset.length
      values:
        - {kind: uniform, min_length: 2, max_length: 8}
        - {kind: negative-binomial, min_length: 2, max_length: 8, r: 3.0, p: 0.6, out_of_support: resample}
    - group: data.datasets.train.dataset.grammar.lexicon
      values:
        - f16-k4-du-ru-cn
        - f16-k4-du-ru-c0
        - f16-k4-du-ru-cp
        - f16-k4-du-rp-cn
        - f16-k4-du-rp-c0
        - f16-k4-du-rp-cp
        - f16-k4-dp-ru-cn
        - f16-k4-dp-ru-c0
        - f16-k4-dp-ru-cp
        - f16-k4-dp-rp-cn
        - f16-k4-dp-rp-c0
        - f16-k4-dp-rp-cp
        - f16-k8-du-ru-cn
        - f16-k8-du-ru-c0
        - f16-k8-du-ru-cp
        - f16-k8-du-rp-cn
        - f16-k8-du-rp-c0
        - f16-k8-du-rp-cp
        - f16-k8-dp-ru-cn
        - f16-k8-dp-ru-c0
        - f16-k8-dp-ru-cp
        - f16-k8-dp-rp-cn
        - f16-k8-dp-rp-c0
        - f16-k8-dp-rp-cp
        - f32-k4-du-ru-cn
        - f32-k4-du-ru-c0
        - f32-k4-du-ru-cp
        - f32-k4-du-rp-cn
        - f32-k4-du-rp-c0
        - f32-k4-du-rp-cp
        - f32-k4-dp-ru-cn
        - f32-k4-dp-ru-c0
        - f32-k4-dp-ru-cp
        - f32-k4-dp-rp-cn
        - f32-k4-dp-rp-c0
        - f32-k4-dp-rp-cp
        - f32-k8-du-ru-cn
        - f32-k8-du-ru-c0
        - f32-k8-du-ru-cp
        - f32-k8-du-rp-cn
        - f32-k8-du-rp-c0
        - f32-k8-du-rp-cp
        - f32-k8-dp-ru-cn
        - f32-k8-dp-ru-c0
        - f32-k8-dp-ru-cp
        - f32-k8-dp-rp-cn
        - f32-k8-dp-rp-c0
        - f32-k8-dp-rp-cp
  seeds: [0, 1, 2, 3]
  expected_points: 384
seed_policy: {root: 311}
rows:
  - {evaluator: lexical-recovery, metric: lexical-type-f1}
  - {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
  - {evaluator: lexical-recovery, metric: primitive-random-relabeling-floor}
primary: {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
preregistration: lexical-distribution.json
factors:
  length-law:
    axis: data.datasets.train.dataset.length
    levels:
      - {level: uniform, value: {kind: uniform, min_length: 2, max_length: 8}}
      - {level: negative-binomial, value: {kind: negative-binomial, min_length: 2, max_length: 8, r: 3.0, p: 0.6, out_of_support: resample}}
  lexical-profile: {axis: data.datasets.train.dataset.grammar.lexicon}
compute: {kind: unpriced}
contraction:
  rungs:
    - {kind: seeds, floor: 4}
    - {kind: fallback}
  factorial: length law crossed with every form-count, category-diversity, category-share, form-frequency, and coupling profile
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-03-15"
  signal:
    kind: metric
    row: {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: Lexical primitive recovery does not exceed a nonzero score across the distribution grid.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 4
  seed_budget: {metric: primitive-many-to-one-accuracy, target: mean, precision: 0.05, level: 0.95}
