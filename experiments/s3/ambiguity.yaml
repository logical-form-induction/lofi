role: lexical-ambiguity
freeze_id: freeze/1
config: {kind: run, path: s3-run.yaml}
launch: {kind: array, chunk_size: 1, throttle: 32}
failure: {numerical: final, out_of_memory: retry}
sweep:
  grid:
    - group: data.datasets.train.dataset.grammar.lexicon.ambiguity
      values:
        - a125-s0-pn
        - a125-s0-p0
        - a125-s0-pp
        - a125-s1-pn
        - a125-s1-p0
        - a125-s1-pp
        - a200-s0-pn
        - a200-s0-p0
        - a200-s0-pp
        - a200-s1-pn
        - a200-s1-p0
        - a200-s1-pp
  seeds: [0, 1, 2, 3]
  expected_points: 48
seed_policy: {root: 312}
rows:
  - {evaluator: lexical-recovery, metric: lexical-type-f1}
  - {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
  - {evaluator: lexical-recovery, metric: primitive-random-relabeling-floor}
primary: {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
preregistration: ambiguity.json
factors:
  ambiguity-profile: {axis: data.datasets.train.dataset.grammar.lexicon.ambiguity}
compute: {kind: unpriced}
contraction:
  rungs:
    - {kind: seeds, floor: 4}
    - {kind: fallback}
  factorial: ambiguity amount, spread, and frequency placement at fixed lexicon and frequency marginals
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-03-15"
  signal:
    kind: metric
    row: {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: Lexical primitive recovery does not exceed a nonzero score across the ambiguity grid.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 4
  seed_budget: {metric: primitive-many-to-one-accuracy, target: mean, precision: 0.05, level: 0.95}
