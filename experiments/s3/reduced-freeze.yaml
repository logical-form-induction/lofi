role: lexical-ambiguity
freeze_id: freeze/1
config: {kind: run, path: s3-run.yaml}
launch: {kind: serial}
failure: {numerical: final, out_of_memory: retry}
sweep:
  grid:
    - group: data.datasets.train.dataset.grammar.lexicon.ambiguity
      values: [low-frequency, high-frequency]
    - path: data.datasets.train.dataset.size
      values: [64]
  seeds: [0, 1, 2, 3]
  expected_points: 8
seed_policy: {root: 313}
rows:
  - {evaluator: lexical-recovery, metric: lexical-type-f1}
  - {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
  - {evaluator: lexical-recovery, metric: primitive-random-relabeling-floor}
primary: {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
preregistration: reduced-freeze.json
factors:
  ambiguity-frequency:
    axis: data.datasets.train.dataset.grammar.lexicon.ambiguity
    levels:
      - {level: -0.75, value: low-frequency}
      - {level: 0.75, value: high-frequency}
compute: {kind: unpriced}
contraction:
  rungs: [{kind: fallback}]
  factorial: two ambiguity-frequency placements crossed with four seeds
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-03-15"
  signal:
    kind: metric
    row: {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: The reduced ambiguity freeze does not recover lexical primitives above zero.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 4
  seed_budget: {metric: primitive-many-to-one-accuracy, target: mean, precision: 0.1, level: 0.95}
