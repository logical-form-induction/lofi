role: supervision-noise
freeze_id: freeze/1
config: {kind: run, path: s4-positive-only-run.yaml}
launch: {kind: serial}
failure: {numerical: final, out_of_memory: retry}
sweep:
  yoked:
    - - path: data.datasets.train.dataset.corruption
        values:
          - null
          - &corruption
            proportion: {value: 0.25, draw: exact}
            operators:
              entries:
                - {operator: {kind: swap, edits: 1}, weight: 1.0}
                - {operator: {kind: deletion, edits: 1}, weight: 1.0}
            attempts: 100
          - *corruption
          - *corruption
          - *corruption
      - path: data.datasets.train.dataset.noise
        values:
          - null
          - {grammatical: {rate: 0.0}, ungrammatical: {rate: 1.0}}
          - null
          - {grammatical: {rate: 0.0}, ungrammatical: {rate: 0.0}}
          - {grammatical: {rate: 0.2}, ungrammatical: {rate: 0.2}}
  grid:
    - path: data.datasets.train.dataset.size
      values: [16]
    - path: data.datasets.train.dataset.length
      values: [{kind: uniform, min_length: 1, max_length: 2}]
  seeds: [0]
  expected_points: 5
seed_policy: {root: 317}
rows:
  - {evaluator: lexical-recovery, metric: lexical-type-f1}
  - {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
  - {evaluator: lexical-recovery, metric: primitive-random-relabeling-floor}
primary: {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
preregistration: reduced-freeze.json
compute: {kind: unpriced}
contraction:
  rungs: [{kind: fallback}]
  factorial: clean and noisy representatives of all three supervision regimes
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-04-01"
  signal:
    kind: metric
    row: {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: The reduced supervision-and-noise freeze does not recover lexical primitives above its empirical floor.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 1
  seed_budget: {metric: primitive-many-to-one-accuracy, target: mean, precision: 0.1, level: 0.95}
