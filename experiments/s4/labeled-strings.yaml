role: supervision-noise
freeze_id: freeze/1
config: {kind: run, path: s4-labeled-strings-run.yaml}
launch: {kind: array, chunk_size: 1, throttle: 32}
failure: {numerical: final, out_of_memory: retry}
sweep:
  grid:
    - path: data.datasets.train.dataset.corruption
      values:
        - proportion: {value: 0.25, draw: exact}
          operators:
            entries:
              - {operator: {kind: swap, edits: 1}, weight: 1.0}
              - {operator: {kind: deletion, edits: 1}, weight: 1.0}
          attempts: 100
    - path: data.datasets.train.dataset.noise
      values:
        - &noise-000 {grammatical: {rate: 0.0}, ungrammatical: {rate: 0.0}}
        - &noise-005 {grammatical: {rate: 0.05}, ungrammatical: {rate: 0.05}}
        - &noise-010 {grammatical: {rate: 0.1}, ungrammatical: {rate: 0.1}}
        - &noise-020 {grammatical: {rate: 0.2}, ungrammatical: {rate: 0.2}}
        - &noise-030 {grammatical: {rate: 0.3}, ungrammatical: {rate: 0.3}}
        - &noise-040 {grammatical: {rate: 0.4}, ungrammatical: {rate: 0.4}}
    - group: data.datasets.train.dataset.grammar.lexicon
      values:
        - baseline
        - large-diverse
        - power-coupling-negative
        - power-coupling-zero
        - power-coupling-positive
        - ambiguous-frequent
  seeds: [0, 1, 2, 3]
  expected_points: 144
seed_policy: {root: 316}
rows:
  - {evaluator: lexical-recovery, metric: lexical-type-f1}
  - {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
  - {evaluator: lexical-recovery, metric: primitive-random-relabeling-floor}
primary: {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
preregistration: labeled-strings.json
factors:
  label-flip-rate:
    axis: data.datasets.train.dataset.noise
    levels:
      - {level: 0.0, value: *noise-000}
      - {level: 0.05, value: *noise-005}
      - {level: 0.1, value: *noise-010}
      - {level: 0.2, value: *noise-020}
      - {level: 0.3, value: *noise-030}
      - {level: 0.4, value: *noise-040}
  lexical-profile: {axis: data.datasets.train.dataset.grammar.lexicon}
compute: {kind: unpriced}
contraction:
  rungs:
    - {kind: seeds, floor: 4}
    - {kind: fallback}
  factorial: symmetric label-flip rate crossed with six representative lexical profiles
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-04-01"
  signal:
    kind: metric
    row: {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: Labeled-string lexical recovery reaches its empirical floor before the declared label-flip ladder ends.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 4
  seed_budget: {metric: primitive-many-to-one-accuracy, target: mean, precision: 0.05, level: 0.95}
