role: supervision-noise
freeze_id: freeze/1
config: {kind: run, path: s4-certified-negatives-run.yaml}
launch: {kind: array, chunk_size: 1, throttle: 32}
failure: {numerical: final, out_of_memory: retry}
sweep:
  grid:
    - path: data.datasets.train.dataset.corruption
      values:
        - &corruption-005
          proportion: {value: 0.05, draw: exact}
          operators: &operators
            entries:
              - {operator: {kind: swap, edits: 1}, weight: 1.0}
              - {operator: {kind: deletion, edits: 1}, weight: 1.0}
          attempts: 100
        - &corruption-010
          proportion: {value: 0.1, draw: exact}
          operators: *operators
          attempts: 100
        - &corruption-025
          proportion: {value: 0.25, draw: exact}
          operators: *operators
          attempts: 100
        - &corruption-050
          proportion: {value: 0.5, draw: exact}
          operators: *operators
          attempts: 100
    - group: data.datasets.train.dataset.grammar.lexicon
      values:
        - baseline
        - large-diverse
        - power-coupling-negative
        - power-coupling-zero
        - power-coupling-positive
        - ambiguous-frequent
  seeds: [0, 1, 2, 3]
  expected_points: 96
seed_policy: {root: 315}
rows:
  - {evaluator: lexical-recovery, metric: lexical-type-f1}
  - {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
  - {evaluator: lexical-recovery, metric: primitive-random-relabeling-floor}
primary: {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
preregistration: certified-negatives.json
factors:
  certified-negative-share:
    axis: data.datasets.train.dataset.corruption
    levels:
      - {level: 0.05, value: *corruption-005}
      - {level: 0.1, value: *corruption-010}
      - {level: 0.25, value: *corruption-025}
      - {level: 0.5, value: *corruption-050}
  lexical-profile: {axis: data.datasets.train.dataset.grammar.lexicon}
compute: {kind: unpriced}
contraction:
  rungs:
    - {kind: seeds, floor: 4}
    - {kind: fallback}
  factorial: certified-negative share crossed with six representative lexical profiles
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-04-01"
  signal:
    kind: metric
    row: {evaluator: lexical-recovery, metric: primitive-many-to-one-accuracy}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: Certified negative strings do not improve lexical recovery above its empirical floor.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 4
  seed_budget: {metric: primitive-many-to-one-accuracy, target: mean, precision: 0.05, level: 0.95}
