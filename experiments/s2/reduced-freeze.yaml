role: source-comparison
freeze_id: freeze/1
config: {kind: run, path: s2-run.yaml}
launch: {kind: serial}
failure: {numerical: final, out_of_memory: retry}
sweep:
  yoked:
    - - group: data.datasets.train.dataset
        values:
          - s2-source-run
          - s2-source-run
          - slashes-application-k2-depth1-reversed
          - slashes-application-k2-depth1-scrambled
      - group: model.language
        values:
          - slashes-application-k2-depth1
          - arrow-composition-k4-depth2
          - slashes-application-k2-depth1
          - slashes-application-k2-depth1
      - group: model.spaces.categories.combinators
        values:
          - application
          - arrow-composition
          - application
          - application
      - path: comparison.source
        values:
          - slashes-application-k2-depth1
          - slashes-application-k2-depth1
          - slashes-application-k2-depth1
          - slashes-application-k2-depth1
      - path: comparison.condition
        values:
          - primary
          - primary
          - reversed-ground-truth
          - lexicon-scrambled
      - path: comparison.direction
        values: [directed, undirected, directed, directed]
  grid:
    - path: data.datasets.train.dataset.size
      values: [8]
  seeds: [0]
  expected_points: 10
signature_twins: {count: 3, seed: 109, primary_condition: primary, observed_twin: observed}
seed_policy: {root: 109}
rows:
  - {evaluator: held-out, metric: string-log-likelihood-per-sentence}
  - {evaluator: held-out, metric: description-length-nats}
primary: {evaluator: held-out, metric: string-log-likelihood-per-sentence}
reports:
  - name: held-out-fit
    rows: [held-out/string-log-likelihood-per-sentence]
    columns: [freeze_id, config_hash, split, n, value]
    labels: [Freeze, Configuration, Split, Sentences, Log-likelihood per sentence]
    precision: 3
reducers:
  - kind: source-comparison
    metric: string-log-likelihood-per-sentence
    source_path: comparison.source
    candidate_path: model.language.grammar.name
    data_size_path: data.datasets.train.dataset.size
    condition_path: comparison.condition
    direction_path: comparison.direction
    twin_path: comparison.twin
    description_length_metric: description-length-nats
    primary_condition: primary
    reversed_ground_truth_condition: reversed-ground-truth
    lexicon_scrambled_condition: lexicon-scrambled
    observed_twin: observed
    permutation: {replicates: 99, seed: 109}
    equivalence: {replicates: 99, seed: 110}
    falsifier: A candidate grammar or validity control matches the planted source grammar.
    smoke_test: true
preregistration: reduced-freeze.json
factors:
  source-grammar:
    axis: data.datasets.train.dataset
    levels:
      - {level: slashes-application-k2-depth1, value: s2-source-run}
  candidate-grammar: {axis: model.language}
  data-size: {axis: data.datasets.train.dataset.size}
compute: {kind: unpriced}
contraction:
  rungs: [{kind: fallback}]
  factorial: one source grammar crossed with two candidate grammars and two validity controls
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-03-01"
  signal:
    kind: metric
    row: {evaluator: held-out, metric: string-log-likelihood-per-sentence}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: The reduced freeze does not identify the planted source grammar.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 1
  seed_budget: {metric: string-log-likelihood-per-sentence, target: mean, precision: 0.1, level: 0.95}
