defaults: [s2-source-run]
kind: synthetic
grammar:
  name: slashes-raised-k8-depth3
  signature:
    name: slashes-raised-k8-depth3
    primitives: [S, P1, P2, P3, P4, P5, P6, P7]
  rules:
    name: slashes-raised
    rules:
      - {rule: application, view: /}
      - {rule: application, view: "\\"}
      - {rule: composition, direction: unrestricted, order: 1, view: /}
      - {rule: composition, direction: unrestricted, order: 1, view: "\\"}
      - {rule: type-raising, view: /, targets: [S], arguments: null}
      - {rule: type-raising, view: "\\", targets: [S], arguments: null}
  lexicon:
    max_depth: 3
