defaults: [slashes-application-k2-depth1]
from: inline
grammar:
  name: arrow-generalized-composition-k16-depth1
  signature:
    name: arrow-generalized-composition-k16-depth1
    primitives: [S, P1, P2, P3, P4, P5, P6, P7, P8, P9, P10, P11, P12, P13, P14, P15]
    constructors:
      - name: arrow
        kind: [Cat, Cat, Cat]
        notation: {style: infix, spelling: "->", precedence: 10, associativity: left}
    functors:
      - {name: arrow, constructor: arrow, argument_side: either, opposite: arrow}
  rules:
    name: arrow-generalized-composition
    rules:
      - {rule: application, view: arrow}
      - {rule: composition, direction: unrestricted, order: null, view: arrow}
  normal_form: {kind: undirected-eisner}
  lexicon:
    max_depth: 1
