defaults: [slashes-application-k2-depth1]
from: inline
grammar:
  name: arrow-composition-k4-depth2
  signature:
    name: arrow-composition-k4-depth2
    primitives: [S, P1, P2, P3]
    constructors:
      - name: arrow
        kind: [Cat, Cat, Cat]
        notation: {style: infix, spelling: "->", precedence: 10, associativity: left}
    functors:
      - {name: arrow, constructor: arrow, argument_side: either, opposite: arrow}
  rules:
    name: arrow-composition
    rules:
      - {rule: application, view: arrow}
      - {rule: composition, direction: unrestricted, order: 1, view: arrow}
  normal_form: {kind: undirected-eisner}
  lexicon:
    max_depth: 2
