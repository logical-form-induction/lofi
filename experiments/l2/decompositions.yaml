role: preflight
freeze_id: freeze/1
config: {kind: run, path: l2-run.yaml}
launch: {kind: serial}
failure: {numerical: final, out_of_memory: retry}
sweep:
  grid:
    - group: data.datasets.train.dataset.source.interpretation.meanings.source.structure
      values: [quantifier-free, quantifier-free-cause-become]
  seeds: [0]
  expected_points: 2
seed_policy: {root: 109}
rows: [{evaluator: labels, metric: inference-label-3-way}]
primary: {evaluator: labels, metric: inference-label-3-way}
preregistration: decompositions.json
factors:
  decomposition:
    axis: data.datasets.train.dataset.source.interpretation.meanings.source.structure
    levels:
      - {level: flat, value: quantifier-free}
      - {level: cause-become, value: quantifier-free-cause-become}
compute: {kind: unpriced}
contraction:
  rungs: [{kind: fallback}]
  factorial: flat and CAUSE/BECOME-style source decompositions
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-03-01"
  signal:
    kind: metric
    row: {evaluator: labels, metric: inference-label-3-way}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: The decomposition preflight does not establish a candidate-logic winner.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 1
  seed_budget: {metric: decided-label-rate, target: mean, precision: 0.1, level: 0.95}
