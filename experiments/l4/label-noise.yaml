role: lexical-distribution
freeze_id: freeze/1
config: {kind: run, path: l4-run.yaml}
launch: {kind: array, chunk_size: 1, throttle: 32}
failure: {numerical: reseed, out_of_memory: retry}
sweep:
  grid:
    - path: data.datasets.train.dataset.proportion
      values:
        - {entails: 0.5, contradicts: 0.25, neutral: 0.25, tolerance: 0.1}
    - path: data.datasets.train.dataset.label_noise
      values:
        - null
        - rates:
            - {relation: entails, rate: 0.1}
            - {relation: contradicts, rate: 0.1}
            - {relation: neutral, rate: 0.1}
          confusion: {kind: uniform}
          tolerance: 0.5
        - rates:
            - {relation: entails, rate: 0.2}
            - {relation: contradicts, rate: 0.2}
            - {relation: neutral, rate: 0.2}
          confusion: {kind: uniform}
          tolerance: 0.5
        - rates:
            - {relation: entails, rate: 0.2}
            - {relation: contradicts, rate: 0.2}
            - {relation: neutral, rate: 0.2}
          confusion:
            kind: tabular
            rows:
              - {oracle: entails, neutral: 1.0}
              - {oracle: contradicts, neutral: 1.0}
              - {oracle: neutral, entails: 1.0}
          tolerance: 0.5
  seeds: [0, 1, 2, 3]
  expected_points: 16
seed_policy: {root: 412}
rows:
  - {evaluator: logical-forms, metric: logical-form-normal-form}
  - {evaluator: logical-forms, metric: many-to-one-accuracy}
  - {evaluator: logical-forms, metric: random-relabeling-floor}
  - {evaluator: logical-forms, metric: fiber-relative-recovery}
primary: {evaluator: logical-forms, metric: fiber-relative-recovery}
preregistration: label-noise.json
factors:
  label-noise:
    axis: data.datasets.train.dataset.label_noise
    levels:
      - {level: clean, value: null}
      - level: uniform-0.1
        value:
          rates:
            - {relation: entails, rate: 0.1}
            - {relation: contradicts, rate: 0.1}
            - {relation: neutral, rate: 0.1}
          confusion: {kind: uniform}
          tolerance: 0.5
      - level: uniform-0.2
        value:
          rates:
            - {relation: entails, rate: 0.2}
            - {relation: contradicts, rate: 0.2}
            - {relation: neutral, rate: 0.2}
          confusion: {kind: uniform}
          tolerance: 0.5
      - level: asymmetric-0.2
        value:
          rates:
            - {relation: entails, rate: 0.2}
            - {relation: contradicts, rate: 0.2}
            - {relation: neutral, rate: 0.2}
          confusion:
            kind: tabular
            rows:
              - {oracle: entails, neutral: 1.0}
              - {oracle: contradicts, neutral: 1.0}
              - {oracle: neutral, entails: 1.0}
          tolerance: 0.5
compute: {kind: unpriced}
contraction:
  rungs:
    - {kind: seeds, floor: 4}
    - {kind: fallback}
  factorial: clean labels, two uniform flip rates, and one declared asymmetric confusion matrix
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-04-15"
  signal:
    kind: metric
    row: {evaluator: logical-forms, metric: fiber-relative-recovery}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: Logical-form recovery does not exceed its fitted fiber floor under the declared label-confusion treatments.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 4
  seed_budget: {metric: fiber-relative-recovery, target: mean, precision: 0.05, level: 0.95}
