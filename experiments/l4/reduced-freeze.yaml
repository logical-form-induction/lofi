role: lexical-distribution
freeze_id: freeze/1
config: {kind: run, path: l4-run.yaml}
launch: {kind: serial}
failure: {numerical: reseed, out_of_memory: retry}
sweep:
  yoked:
    - - path: data.datasets.train.dataset.proportion
        values:
          - {entails: 1.0, contradicts: 0.0, neutral: 0.0, tolerance: 0.0}
          - {entails: 0.5, contradicts: 0.25, neutral: 0.25, tolerance: 0.1}
          - {entails: 0.5, contradicts: 0.25, neutral: 0.25, tolerance: 0.1}
          - {entails: 0.5, contradicts: 0.25, neutral: 0.25, tolerance: 0.1}
      - path: data.datasets.train.dataset.label_noise
        values:
          - null
          - null
          - rates:
              - {relation: entails, rate: 0.2}
              - {relation: contradicts, rate: 0.2}
              - {relation: neutral, rate: 0.2}
            confusion: {kind: uniform}
            tolerance: 0.5
          - rates:
              - {relation: entails, rate: 0.2}
              - {relation: contradicts, rate: 0.2}
              - {relation: neutral, rate: 0.2}
            confusion:
              kind: tabular
              rows:
                - {oracle: entails, neutral: 1.0}
                - {oracle: contradicts, neutral: 1.0}
                - {oracle: neutral, entails: 1.0}
            tolerance: 0.5
  seeds: [0]
  expected_points: 4
seed_policy: {root: 413}
rows:
  - {evaluator: logical-forms, metric: logical-form-normal-form}
  - {evaluator: logical-forms, metric: many-to-one-accuracy}
  - {evaluator: logical-forms, metric: random-relabeling-floor}
  - {evaluator: logical-forms, metric: fiber-relative-recovery}
primary: {evaluator: logical-forms, metric: fiber-relative-recovery}
preregistration: reduced-freeze.json
factors:
  relation-regime:
    axis: data.datasets.train.dataset.proportion
    levels:
      - {level: entailment-only, value: {entails: 1.0, contradicts: 0.0, neutral: 0.0, tolerance: 0.0}}
      - {level: entailment-and-non-entailment, value: {entails: 0.5, contradicts: 0.25, neutral: 0.25, tolerance: 0.1}}
  label-noise:
    axis: data.datasets.train.dataset.label_noise
    levels:
      - {level: clean, value: null}
      - level: uniform-0.2
        value:
          rates:
            - {relation: entails, rate: 0.2}
            - {relation: contradicts, rate: 0.2}
            - {relation: neutral, rate: 0.2}
          confusion: {kind: uniform}
          tolerance: 0.5
      - level: asymmetric-0.2
        value:
          rates:
            - {relation: entails, rate: 0.2}
            - {relation: contradicts, rate: 0.2}
            - {relation: neutral, rate: 0.2}
          confusion:
            kind: tabular
            rows:
              - {oracle: entails, neutral: 1.0}
              - {oracle: contradicts, neutral: 1.0}
              - {oracle: neutral, entails: 1.0}
          tolerance: 0.5
compute: {kind: unpriced}
contraction:
  rungs: [{kind: fallback}]
  factorial: entailment-only, clean mixed, uniform-noise mixed, and asymmetric-confusion mixed treatments
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2027-04-15"
  signal:
    kind: metric
    row: {evaluator: logical-forms, metric: fiber-relative-recovery}
    statistic: mean
    direction: above
    threshold: 0.0
  fallback: The reduced supervision freeze does not recover logical forms above its fitted fiber floor.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 1
  seed_budget: {metric: fiber-relative-recovery, target: mean, precision: 0.1, level: 0.95}
