# The documentation experiment with a seed rung, a fallback rung and one report table.
role: preflight
freeze_id: freeze/1
config:
  kind: run
  path: ../synthetic-parser.yaml
launch: {kind: serial}
failure: {numerical: final, out_of_memory: retry}
sweep:
  grid:
    - path: optimizer.learning_rate
      values: [0.001, 0.0005]
  seeds: [0, 1, 2, 3]
  expected_points: 8
seed_policy:
  root: 7
rows:
  - {evaluator: held-out, metric: unlabeled-bracketing-f1}
primary: {evaluator: held-out, metric: unlabeled-bracketing-f1}
reports:
  - name: bracketing
    rows: [held-out/unlabeled-bracketing-f1]
    columns: [config_hash, seed, value, ci_low, ci_high, nan_rate]
    labels: [Configuration, Seed, F1, Low, High, Missing]
    precision: 3
preregistration: ../experiments/preregistration.json
compute:
  kind: unpriced
contraction:
  rungs:
    - {kind: seeds, floor: 2}
    - {kind: fallback}
  factorial: two learning rates crossed with four seeds
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2026-12-01"
  signal:
    kind: metric
    row: {evaluator: held-out, metric: unlabeled-bracketing-f1}
    statistic: max
    direction: above
    threshold: 0.0
  fallback: The synthetic parser stack trains at one learning rate.
evaluation:
  alpha: 0.05
  correction: {kind: holm}
  dependence: arbitrary
  minimum_seeds: 2
  seed_budget:
    metric: recovery
    target: mean
    precision: 0.05
    level: 0.95
