# A pre-flight experiment over the documentation run, small enough to price locally.
role: preflight
freeze_id: freeze/1
config:
  kind: run
  path: ../synthetic-parser.yaml
launch: {kind: serial}
failure: {numerical: final, out_of_memory: retry}
sweep:
  grid:
    - path: optimizer.learning_rate
      values: [0.001, 0.0005]
  seeds: [0, 1, 2]
  expected_points: 6
seed_policy:
  root: 7
rows:
  - {evaluator: held-out, metric: unlabeled-bracketing-f1}
primary: {evaluator: held-out, metric: unlabeled-bracketing-f1}
preregistration: preregistration.json
compute:
  kind: unpriced
contraction:
  rungs:
    - kind: fallback
  factorial: two learning rates crossed with three seeds
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2026-12-01"
  signal:
    kind: metric
    row: {evaluator: held-out, metric: unlabeled-bracketing-f1}
    statistic: max
    direction: above
    threshold: 0.0
  fallback: The synthetic parser stack trains at one learning rate.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 3
  seed_budget:
    metric: recovery
    target: mean
    precision: 0.05
    level: 0.95
