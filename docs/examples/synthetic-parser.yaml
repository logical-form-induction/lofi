# A small, complete run intended for local documentation exercises.
defaults:
  - model.parser: inside-outside
  - model.token_encoder: static
  - model.subword_pooler: first
  - model.encoders.terms: rnn
  - model.controller: mlp
  - model.decoders.identity: rnn
  - model.decoders.application: rnn
  - model.readouts: types
  - data.datasets.train.dataset: synthetic
  - data.datasets.train.dataset.grammar: directed
  - data.datasets.train.featurizer: unlabeled
  - optimizer: adamw
  - scheduler: cosine
  - device_policy: cpu
parse: {retain: forest, reachability: all}
approximation: {residual_mass: 0.75}
model:
  language: {from: data}
  parser:
    width: 4
  token_encoder:
    vectors: lofi.resource:run/synthetic-parser.vec
    vectors_format: glove
    trainable: true
  encoders:
    terms:
      width: 4
      layers: 1
      norm_cap: null
  controller:
    hidden: [{width: 4, activation: tanh}]
  decoders:
    identity:
      width: 4
    application:
      width: 4
  spaces:
    categories:
      sort: Cat
      encoder: terms
      identity: identity
      combinators:
        merge: concatenate
        decoders:
          "application:/": application
          "application:\\": application
  readouts:
    category-terms:
      kind: terms
      space: categories
      reads: inside
      decoding: {strategy: exhaustive, residual_mass: null, cap: 64}
loss:
  terms:
    - objective:
        kind: grammaticality
        readout: sentences
        noise: 0.0
      weight: 1.0
    - objective:
        kind: coherence
        readout: category-terms
        space: categories
        estimator: truncated
        divergence:
          kind: kl
        warmup: null
      weight: 0.1
data:
  datasets:
    train:
      dataset:
        retained: {validation: 0.25}
        language:
          name: synthetic-parser
          atomic_types: [{name: e}, {name: t}]
          constructors:
            - {name: "->", kind: [Ty, Ty, Ty], notation: {style: infix, spelling: "->", precedence: 1, associativity: right}}
          constants: []
          binders: {style: curry}
        grammar:
          formalism: declared
          name: synthetic-parser
          signature:
            primitives: [S, NP, conj]
            operators:
              - {name: 'NP[conj]', sort: Cat, erases_to: NP}
            conjunctions:
              markers: [conj]
              pairs:
                - unmarked: NP
                  marked: NP[conj]
          rules:
            name: application
            rules:
              - rule: application
                view: /
              - rule: application
                view: "\\"
          lexicon:
            kind: inline
            entries:
              - {form: word-0, category: NP}
              - {form: word-1, category: "S\\NP"}
              - {form: word-2, category: "S\\NP/NP"}
              - {form: word-3, category: NP/NP}
              - {form: word-4, category: NP}
              - {form: word-5, category: "S\\NP"}
              - {form: word-6, category: "S\\NP/NP"}
              - {form: word-7, category: NP/NP}
          goal:
            categories: [S]
          matching:
            kind: feature-erasure
          budget:
            unary_rounds: 1
        size: 4
        seed: 5
        length:
          kind: uniform
          min_length: 2
          max_length: 3
      featurizer:
        padding: <pad>
trainer:
  kind: parser
  dataset: train
  epochs: 1
  batch_size: 2
  batch_sampler: {kind: length-bucket, bucket_factor: 100, reshuffle_each_epoch: false}
  accumulation_steps: 2
  max_grad_norm: null
  active_groups: [token_encoder, terms, identity, application, controller, parser]
  early_stopping:
    metric: loss/grammaticality
    mode: min
    patience: 2
    minimum_delta: 0.0
    keep_best: 1
  checkpoints:
    interval: 1
    keep: 1
release:
  checkpoint: validation-best
optimizer:
  weight_decay: 0.0
evaluators:
  held-out:
    kind: bracketing
    interval: {replicates: 50, level: 0.95}
    punctuation: {source: none, forms: []}
    decoder: minimum-risk
    conventions:
      punctuation: keep
      unary_chains: keep
      trivial_spans: keep
      minimum_length: 1
      aggregation: corpus
      coverage: zero
      self_arcs: allow
      gold_derivation: canonical
