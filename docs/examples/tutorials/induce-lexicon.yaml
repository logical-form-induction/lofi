# The declared-grammar run with held-out splits and two recovery evaluators.
defaults:
  - declared-grammar
data:
  datasets:
    train:
      dataset:
        retained: {validation: 0.2, development: 0.2, test: 0.2}
        size: 40
evaluators:
  brackets:
    kind: bracketing
    interval: {replicates: 50, level: 0.95}
    punctuation: {source: none, forms: []}
    decoder: minimum-risk
    conventions: &conventions
      punctuation: keep
      unary_chains: keep
      trivial_spans: keep
      minimum_length: 1
      aggregation: corpus
      coverage: zero
      self_arcs: allow
      gold_derivation: canonical
  types:
    kind: lexical-types
    interval: {replicates: 50, level: 0.95}
    readout: category-terms
    alignment:
      kind: one-to-one
      tie_break: least-gold-label
      fit_on: development
      score_on: test
      random_floor: {replicates: 50, level: 0.95}
      stability: {replicates: 50, level: 0.95}
    conventions: *conventions
