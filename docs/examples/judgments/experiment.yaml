# Compare two variational guides over the same synthetic judgment design.
role: preflight
freeze_id: freeze/1
config:
  kind: judgment-fit
  path: known-effects.yaml
launch: {kind: serial}
failure: {numerical: final, out_of_memory: retry}
sweep:
  grid:
    - path: inference.guide
      values: [structured, mean_field]
  seeds: [0, 1, 2]
  expected_points: 6
seed_policy:
  root: 7
rows:
  - {evaluator: fit, metric: evidence-bound}
primary: {evaluator: fit, metric: evidence-bound}
preregistration: preregistration.json
compute:
  kind: unpriced
contraction:
  rungs:
    - kind: fallback
  factorial: two variational guides crossed with three seeds
stop_rules:
  - name: numerical failure
    when: {kind: points, statuses: [numerical-failure], at_least: 1}
decision_point:
  date: "2026-12-01"
  signal:
    kind: metric
    row: {evaluator: fit, metric: evidence-bound}
    statistic: max
    direction: above
    threshold: 0.0
  fallback: Inspect each guide fit before increasing its training budget.
evaluation:
  alpha: 0.05
  correction: {kind: benjamini-hochberg}
  dependence: prds
  minimum_seeds: 3
  seed_budget:
    metric: evidence-bound
    target: mean
    precision: 0.05
    level: 0.95
