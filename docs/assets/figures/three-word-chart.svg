<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img" aria-labelledby="title desc">
  <title id="title">An application-only parsing chart for John sees Mary</title>
  <desc id="desc">The bottom row has NP for John, (S backslash NP) slash NP for sees, and NP for Mary. The middle row is empty for John sees and has S backslash NP for sees Mary. The top cell has S for the full sentence. Arrows show forward application combining sees with Mary, then backward application combining John with sees Mary.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#236c8a"/></marker></defs>
  <rect width="780" height="520" rx="12" fill="#fff"/>
  <g stroke="#b1bfca" stroke-width="1.5" fill="#f2f7fa">
    <rect x="285" y="25" width="210" height="85" rx="4"/>
    <rect x="170" y="165" width="210" height="85" rx="4" fill="#fafafa" stroke-dasharray="5 4"/>
    <rect x="400" y="165" width="210" height="85" rx="4"/>
    <rect x="55" y="305" width="210" height="85" rx="4"/>
    <rect x="285" y="305" width="210" height="85" rx="4"/>
    <rect x="515" y="305" width="210" height="85" rx="4"/>
  </g>
  <g fill="none" stroke="#236c8a" stroke-width="2">
    <path d="M390 305 L505 280 L620 305"/>
    <path d="M505 280 V252" marker-end="url(#arrow)"/>
    <path d="M505 165 L390 140"/><path d="M160 305 C70 200 130 140 390 140"/>
    <path d="M390 140 V112" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#162b3b" font-size="27">
    <text x="390" y="62">S</text><text x="505" y="202">S\NP</text>
    <text x="275" y="202" fill="#687782">∅</text>
    <text x="160" y="342">NP</text><text x="390" y="342">(S\NP)/NP</text><text x="620" y="342">NP</text>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#455b6b" font-size="16">
    <text x="390" y="91">[0,3)</text><text x="275" y="231">[0,2)</text><text x="505" y="231">[1,3)</text>
    <text x="160" y="371">[0,1)</text><text x="390" y="371">[1,2)</text><text x="620" y="371">[2,3)</text>
    <text x="505" y="301" font-size="20" fill="#236c8a">&gt;</text>
    <text x="390" y="162" font-size="20" fill="#236c8a">&lt;</text>
    <text x="390" y="494">&gt; forward application     ·     &lt; backward application</text>
  </g>
  <path d="M45 409 H735 M45 402 V416 M275 402 V416 M505 402 V416 M735 402 V416" stroke="#687782" fill="none"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="24" text-anchor="middle" fill="#162b3b">
    <text x="160" y="449">John</text><text x="390" y="449">sees</text><text x="620" y="449">Mary</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#455b6b">
    <text x="45" y="438">0</text><text x="275" y="438">1</text><text x="505" y="438">2</text><text x="735" y="438">3</text>
  </g>
</svg>
